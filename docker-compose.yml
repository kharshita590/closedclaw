services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: closedclaw
      POSTGRES_PASSWORD: closedclaw
      POSTGRES_DB: closedclaw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closedclaw"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - internal

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
    networks:
      - internal

  agent:
    build: ./agent
    container_name: agent
    restart: unless-stopped
    env_file: .env
    environment:
      PROJECT_ROOT: /app
      SECRETS_DIR: secrets
      GOOGLE_CLIENT_SECRET_FILE: /app/secrets/google_client_secret.json
    ports:
      - "8000:8000"
    volumes:
      - ./memory:/app/memory
      - ./secrets:/app/secrets:ro
      - ./logs:/app/logs
    networks:
      - internal
    depends_on:
      browser-sandbox:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./agent
    container_name: worker
    restart: unless-stopped
    env_file: .env
    environment:
      PROJECT_ROOT: /app
      SECRETS_DIR: secrets
      GOOGLE_CLIENT_SECRET_FILE: /app/secrets/google_client_secret.json
    command: celery -A worker.celery_app worker --loglevel=info -Q actions,celery
    volumes:
      - ./memory:/app/memory
      - ./secrets:/app/secrets:ro
      - ./logs:/app/logs
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      browser-sandbox:
        condition: service_started

  browser-sandbox:
    build: ./browser-sandbox
    container_name: browser-sandbox
    restart: unless-stopped
    # Uncomment the next line once gVisor (runsc) is installed on the host:
    # runtime: runsc
    env_file: .env
    environment:
      PROJECT_ROOT: /app
      GOOGLE_CLIENT_SECRET_FILE: /app/secrets/google_client_secret.json
    tmpfs:
      - /tmp
    networks:
      - internal
    volumes:
      - ./browser-sandbox/screenshots:/app/screenshots
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.0"

  ui:
    build: ./ui
    container_name: ui
    restart: unless-stopped
    env_file: .env
    environment:
      GOOGLE_CLIENT_SECRET_FILE: /app/secrets/google_client_secret.json
    ports:
      - "8501:8501"
    volumes:
      - ./memory:/app/memory:ro
      - ./logs:/app/logs:ro
    networks:
      - internal
    depends_on:
      - agent

  # ── Optional bridges ──────────────────────────────────────────────────────
